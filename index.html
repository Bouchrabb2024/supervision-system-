* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --primary: #1a365d;
  --primary-light: #2c5282;
  --primary-dark: #0f2440;
  --secondary: #e2e8f0;
  --accent: #d69e2e;
  --accent-light: #f6e05e;
  --bg-body: #f1f5f9;
  --bg-card: #ffffff;
  --text-dark: #1a202c;
  --text-medium: #4a5568;
  --text-light: #a0aec0;
  --shadow-sm: 0 4px 12px rgba(0,0,0,0.05);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 16px 48px rgba(0,0,0,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg-body);
  color: var(--text-dark);
  min-height: 100vh;
  direction: rtl;
}

/* ---------- الشريط العلوي ---------- */
header {
  background: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  border-bottom: 4px solid var(--accent);
  box-shadow: 0 4px 20px rgba(26,54,93,0.3);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 8px;
}

.header-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}

.header-left .main {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 1px;
  font-family: 'Aref Ruqaa', 'Amiri', 'Traditional Arabic', serif;
  background: linear-gradient(100deg, #ffffff 0%, #ffffff 42%, #fff7d6 48%, #f6e05e 50%, #fff7d6 52%, #ffffff 58%, #ffffff 100%);
  background-size: 260% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: #fff;
  text-shadow: 0 1px 0 rgba(214,158,46,0.5), 0 2px 6px rgba(0,0,0,0.25);
  animation: titleShimmer 5s ease-in-out infinite;
  display: inline-block;
}
@keyframes titleShimmer {
  0% { background-position: 200% center; }
  100% { background-position: -160% center; }
}

.header-left .sub {
  font-size: 11px;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-family: 'Cinzel', 'Georgia', serif;
}

.appbar-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.appbar-meta input {
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: 'Cairo', sans-serif;
  transition: var(--transition);
  min-width: 100px;
  flex: 1 1 80px;
}

.appbar-meta input::placeholder {
  color: rgba(255,255,255,0.6);
}
.appbar-meta input:focus {
  outline: none;
  background: rgba(255,255,255,0.2);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(214,158,46,0.2);
}

/* ---------- باقي الأنماط ---------- */
.shell {
  display: flex;
  max-width: 1440px;
  margin: 12px auto;
  padding: 0 12px;
  gap: 16px;
  align-items: flex-start;
}

nav.tabs {
  flex: 0 0 180px;
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 10px 8px;
  box-shadow: var(--shadow-md);
  border: 1px solid rgba(255,255,255,0.5);
  position: sticky;
  top: 80px;
}

nav.tabs button {
  display: block;
  width: 100%;
  text-align: right;
  padding: 10px 12px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  font-family: 'Cairo', sans-serif;
  color: var(--text-medium);
  border-radius: var(--radius-sm);
  transition: var(--transition);
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
nav.tabs button:hover {
  background: #f7fafc;
  color: var(--primary);
  transform: translateX(-4px);
}
nav.tabs button.active {

<!-- ================= الكود البرمجي (معدل للهاتف) ================= -->
<script>
// ============================================================
//  كشف بيئة الهاتف (لتعطيل ميزات سطح المكتب)
// ============================================================
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 768;
const fsApiSupported = () => 'showDirectoryPicker' in window && !isMobile;

// ============================================================
//  الحالة الأساسية والتخزين (IndexedDB)
// ============================================================
let state = {
  classes: [],
  students: [],
  subjects: [],
  teachers: [],
  attendance: {},
  timetable: {},
  trash: [],
  monthlyStudyHours: {},
  catchupHours: {},
  teacherFreeSlots: {},
  ttDays: ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"],
  ttSlots: 7
};

let activeTab = 'dash';
let attState = { classId: '', date: '' };
let monthState = { classId: '', month: '' };
let currentTtClassId = '';
let currentScheduleTeacherId = '';
let gradesState = { classId: '' };
let classesViewState = { filterClassId: '', selected: new Set(), searchText: '' };

// متغيرات التخزين المحلي (فقط لسطح المكتب)
let localDirHandle = null;
let dirPermissionState = 'unknown'; // 'granted' | 'prompt' | 'denied' | 'unknown'
const BACKUP_INTERVAL_MS = 24 * 60 * 60 * 1000; // كل 24 ساعة
const BACKUP_CHECK_MS = 60 * 60 * 1000; // فحص كل ساعة
const BACKUP_KEEP_DAYS = 30; // الاحتفاظ بنسخ آخر 30 يوماً
const TRASH_KEEP_DAYS = 30; // مدة الاحتفاظ بالمحذوفات قبل الحذف النهائي التلقائي

// دوال مساعدة
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayISO() { return new Date().toISOString().slice(0,10); }
function currentMonthISO() { return todayISO().slice(0,7); }
function computeAnnualAvg(s) {
  const vals = [s.avgT1, s.avgT2, s.avgT3].map(v => parseFloat(v)).filter(v => !isNaN(v));
  if (!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0) / vals.length) * 100) / 100;
}
// معيار الإجازة — يُطبَّق فقط على معدل كل فصل على حدة (ف1، ف2، ف3)
function getTermMeritLabel(avgStr) {
  const avg = parseFloat(avgStr);
  if (isNaN(avg)) return null;
  if (avg > 19.99) return { label: 'تقدير', cls: 'tier-appreciation' };
  if (avg >= 18) return { label: 'امتياز', cls: 'tier-excellent' };
  if (avg >= 16) return { label: 'تهنئة', cls: 'tier-commend' };
  if (avg >= 14) return { label: 'تشجيع', cls: 'tier-encourage' };
  if (avg >= 12) return { label: 'لوحة شرف', cls: 'tier-honor' };
  return null;
}
// ملاحظة خاصة بالمعدل السنوي فقط (لا تُطبَّق عليها معايير الإجازة الفصلية)
function getAnnualNote(avg) {
  if (avg === null || isNaN(avg)) return null;
  if (avg >= 9 && avg <= 9.99) return { label: 'استدراك', cls: 'tier-catchup' };
  return null;
}
function className(id) { const c = state.classes.find(c=>c.id===id); return c ? c.name : '—'; }
function subjectName(id) { const s = state.subjects.find(sub=>sub.id===id); return s ? s.name : ''; }
function teacherName(id) { const t = state.teachers.find(tch=>tch.id===id); return t ? t.name : ''; }
function studentsOf(cid) { return state.students.filter(s=>s.classId===cid); }
function displayName(s) {
  if (!s) return '—';
  const first = (s.firstName || '').trim();
  const last = (s.lastName || '').trim();
  if (!first && !last) return s.name || '—';
  return (first + ' ' + last).trim();
}
function schoolMetaLine() {
  const nameEl = document.getElementById('schoolName');
  const yearEl = document.getElementById('schoolYear');
  const name = nameEl ? nameEl.value.trim() : '';
  const year = yearEl ? yearEl.value.trim() : '';
  const supervisor = getSupervisorName();
  const line1 = [name, year].filter(Boolean).join(' — ');
  if (!line1 && !supervisor) return '';
  return `<div style="text-align:center;margin-bottom:10px;font-family:'Cairo',sans-serif;">
    ${line1 ? `<div style="font-weight:800;color:var(--primary-dark);font-size:15px;">${line1}</div>` : ''}
    ${supervisor ? `<div style="font-weight:600;color:var(--text-medium);font-size:12px;margin-top:2px;">المشرف التربوي: ${supervisor}</div>` : ''}

// ---------- IndexedDB ----------
const DB_NAME = 'SijilDB';
const STORE_NAME = 'appData';
const DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveToDB(data) {
  const db = await openDB();
  const tx = db.transaction(STORE_NAME, 'readwrite');
  const store = tx.objectStore(STORE_NAME);
  store.put(data, 'main_data');
  await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
}

async function loadFromDB() {
  const db = await openDB();
  const tx = db.transaction(STORE_NAME, 'readonly');
  const store = tx.objectStore(STORE_NAME);
  const req = store.get('main_data');
  return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
}

// دوال حفظ واستعادة مقبض المجلد (للمكتب فقط)
async function saveDirHandle(handle) {
  if (!fsApiSupported()) return;
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(handle, 'local_dir_handle');
    await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
  } catch(e) { console.warn('saveDirHandle failed', e); }
}
async function loadDirHandle() {
  if (!fsApiSupported()) return null;
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get('local_dir_handle');
    return new Promise((resolve, reject) => { req.onsuccess = () => resolve(req.result); req.onerror = () => reject(req.error); });
  } catch(e) { return null; }
}
async function deleteDirHandle() {
  if (!fsApiSupported()) return;
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete('local_dir_handle');
    await new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); });
  } catch(e) {}
}

  if (meta) {

      document.getElementById('schoolYear').value = m.schoolYear || '';

  }
  try {

      state = result.state;
      if (!state.teachers) state.teachers = [];
      if (!state.subjects) state.subjects = [];
      if (!state.timetable) state.timetable = {};
      if (!state.trash) state.trash = [];
      if (!state.monthlyStudyHours) state.monthlyStudyHours = {};
      if (!state.catchupHours) state.catchupHours = {};
      if (!state.teacherFreeSlots) state.teacherFreeSlots = {};
      if (!state.ttSlots || state.ttSlots < 7) state.ttSlots = 7;
    }
  } catch(e) { console.error('Load error', e); }
  purgeOldTrash();

  if (state.classes.length) {
    if (!attState.classId) attState.classId = state.classes[0].id;

function purgeOldTrash() {
  if (!state.trash || !state.trash.length) return;
  const cutoff = Date.now() - TRASH_KEEP_DAYS * 24 * 60 * 60 * 1000;
  const before = state.trash.length;
  state.trash = state.trash.filter(t => t.deletedAt >= cutoff);
  if (state.trash.length !== before) saveState();
}

// ============================================================
//  التخزين المحلي عبر File System Access API (فقط لسطح المكتب)
// ============================================================
async function connectLocalFolder() {
  if (!fsApiSupported()) {
    toast('⚠️ هذه الميزة غير مدعومة على الهواتف أو في هذا المتصفح. استخدم زر "تصدير JSON" للنسخ الاحتياطي.');
    return;
  }
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { toast('⚠️ لم يتم منح صلاحية الكتابة على المجلد'); return; }
    localDirHandle = handle;
    dirPermissionState = 'granted';
    await saveDirHandle(handle);
    await writeStateToLocalFolder();
    toast('✅ تم ربط المجلد المحلي — سيتم حفظ نسخة من البيانات فيه تلقائياً');
    render();
  } catch (e) {
    if (e.name !== 'AbortError') { console.error('connectLocalFolder failed', e); toast('⚠️ تعذر ربط المجلد'); }
  }
}

async function disconnectLocalFolder() {
  if (!fsApiSupported()) { toast('⚠️ الميزة غير مدعومة'); return; }
  localDirHandle = null;
  dirPermissionState = 'unknown';
  try { await deleteDirHandle(); } catch(e) {}
  toast('تم فصل المجلد المحلي');
  render();
}

async function tryRestoreDirPermission() {
  if (!fsApiSupported()) return;
  try {
    const handle = await loadDirHandle();
    if (!handle) return;
    localDirHandle = handle;
    dirPermissionState = await handle.queryPermission({ mode: 'readwrite' });
  } catch (e) {
    console.warn('Dir handle restore failed', e);
  }
}

async function reactivateLocalFolder() {
  if (!fsApiSupported() || !localDirHandle) return;
  try {
    dirPermissionState = await localDirHandle.requestPermission({ mode: 'readwrite' });
    if (dirPermissionState === 'granted') toast('✅ تم تفعيل الوصول للمجلد المحلي');
    else toast('⚠️ لم يتم منح الصلاحية');
    render();
  } catch (e) { console.error(e); toast('⚠️ تعذر إعادة التفعيل'); }
}

async function writeJsonToLocalFolder(dirHandle, filename, dataObj) {
  if (!fsApiSupported()) return;
  try {
    const fileHandle = await dirHandle.getFileHandle(filename, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(dataObj, null, 2));
    await writable.close();
  } catch(e) { console.warn('writeJsonToLocalFolder failed', e); }
}

async function writeStateToLocalFolder() {
  if (!fsApiSupported() || !localDirHandle || dirPermissionState !== 'granted') return;
  await writeJsonToLocalFolder(localDirHandle, 'بيانات_حالية.json', buildExportPayload());
}

// ============================================================
//  النسخ الاحتياطي التلقائي (يعمل على الهاتف عبر localStorage)
// ============================================================
function safeTimestamp(d = new Date()) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}-${p(d.getMinutes())}-${p(d.getSeconds())}`;
}
function lastBackupTime() { return Number(localStorage.getItem('sijil_last_backup') || 0); }
function setLastBackupTime(ts) { localStorage.setItem('sijil_last_backup', String(ts)); }

// ---------- تذكير تصدير JSON ----------
const EXPORT_REMINDER_DAYS = 7; // تذكير إذا مرت أكثر من 7 أيام بدون تصدير
const EXPORT_SNOOZE_DAYS = 2; // عند الضغط على "تذكيري لاحقاً" يُؤجَّل يومين
function lastExportTime() { return Number(localStorage.getItem('sijil_last_export') || 0); }
function setLastExportTime(ts) { localStorage.setItem('sijil_last_export', String(ts)); }
function exportSnoozeUntil() { return Number(localStorage.getItem('sijil_export_snooze') || 0); }
function setExportSnoozeUntil(ts) { localStorage.setItem('sijil_export_snooze', String(ts)); }

function daysSince(ts) { if (!ts) return Infinity; return Math.floor((Date.now() - ts) / (24*60*60*1000)); }

function showExportBanner(days) {
  const banner = document.getElementById('exportBanner');
  const text = document.getElementById('exportBannerText');
  if (!banner || !text) return;
  text.textContent = (lastExportTime() ? `آخر تصدير JSON كان قبل ${days} يوم — ` : 'لم تُصدّر أي نسخة JSON بعد — ') + 'يُفضّل تصدير نسخة الآن للحفاظ على بياناتك خارج المتصفح.';
  banner.classList.add('show');
}
function hideExportBanner() {
  const banner = document.getElementById('exportBanner');
  if (banner) banner.classList.remove('show');
}
function dismissExportBanner() {
  setExportSnoozeUntil(Date.now() + EXPORT_SNOOZE_DAYS * 24 * 60 * 60 * 1000);
  hideExportBanner();
}
function checkExportReminder() {
  // لا تُظهر البانر إذا لا توجد بيانات بعد (لا داعي للتذكير قبل إدخال أي تلميذ)
  if (!state.students.length && !state.classes.length) return;
  if (Date.now() < exportSnoozeUntil()) return;
  const days = daysSince(lastExportTime());
  if (days >= EXPORT_REMINDER_DAYS) showExportBanner(days === Infinity ? EXPORT_REMINDER_DAYS : days);
}

async function pruneOldBackups(backupsDir) {
  if (!fsApiSupported()) return;
  try {
    const cutoff = Date.now() - BACKUP_KEEP_DAYS * 24 * 60 * 60 * 1000;
    for await (const [name, handle] of backupsDir.entries()) {
      if (handle.kind !== 'file') continue;
      const file = await handle.getFile();
      if (file.lastModified < cutoff) await backupsDir.removeEntry(name);
    }
  } catch (e) { console.warn('Prune old backups failed', e); }
}

async function performAutoBackup(manual = false) {
  const payload = buildExportPayload();
  let savedToFolder = false;

  // فقط على سطح المكتب مع مجلد مرتبط
  if (fsApiSupported() && localDirHandle && dirPermissionState === 'granted') {
    try {
      const backupsDir = await localDirHandle.getDirectoryHandle('نسخ_احتياطية', { create: true });
      await writeJsonToLocalFolder(backupsDir, `نسخة_احتياطية_${safeTimestamp()}.json`, payload);
      savedToFolder = true;
      await pruneOldBackups(backupsDir);
    } catch (e) { console.error('Auto backup failed', e); }
  }

  // النسخ الاحتياطي في localStorage (يعمل على الهاتف وسطح المكتب)
  localStorage.setItem('sijil_backup', JSON.stringify(payload));
  setLastBackupTime(Date.now());

  if (manual) {
    if (savedToFolder) toast('✅ تم إنشاء نسخة احتياطية في المجلد المحلي و localStorage');
    else if (!fsApiSupported()) toast('✅ تم حفظ نسخة احتياطية في المتصفح (localStorage). استخدم "تصدير JSON" لحفظها كملف.');
    else toast('✅ تم حفظ نسخة احتياطية في المتصفح (localStorage). اربط مجلداً للنسخ على القرص.');
  } else if (savedToFolder) {
    toast('✅ تم إنشاء نسخة احتياطية تلقائية');
  }
  if (activeTab === 'data') render();
}

async function checkAndRunAutoBackup() {
  const last = lastBackupTime();
  if (!last || Date.now() - last >= BACKUP_INTERVAL_MS) await performAutoBackup(false);
}

function scheduleAutoBackup() {
  checkAndRunAutoBackup();
  setInterval(checkAndRunAutoBackup, BACKUP_CHECK_MS);
}

async function setMonthlyStudyHours(value) {
  const hours = Number(value) || 0;
  if (!state.monthlyStudyHours) state.monthlyStudyHours = {};
  if (hours > 0) state.monthlyStudyHours[monthState.month] = hours;
  else delete state.monthlyStudyHours[monthState.month];
  await saveState(); render();
}

// ============================================================
//  كشف النقط (ترتيب ثابت حسب الفصل الأول)
// ============================================================
function getRankedStudents(classId) {
  const list = studentsOf(classId);
  const withT1 = list.map(s => ({ s, t1: parseFloat(s.avgT1) }));
  withT1.sort((a, b) => {
    const aHas = !isNaN(a.t1), bHas = !isNaN(b.t1);
    if (aHas && bHas) return b.t1 - a.t1;
    if (aHas) return -1;
    if (bHas) return 1;
    return displayName(a.s).localeCompare(displayName(b.s), 'ar');
  });
  return withT1.map(w => w.s);
}
function renderGrades() {
  if (!gradesState.classId && state.classes.length) gradesState.classId = state.classes[0].id;
  const ranked = getRankedStudents(gradesState.classId);
  let rows = ranked.map((s, idx) => {
    const annual = computeAnnualAvg(s);
    const m1 = getTermMeritLabel(s.avgT1);
    const m2 = getTermMeritLabel(s.avgT2);
    const m3 = getTermMeritLabel(s.avgT3);
    const aNote = getAnnualNote(annual);
    const cell = (val, merit) => `${val || '—'}${merit ? `<br><span class="badge ${merit.cls}">${merit.label}</span>` : ''}`;
    return `<tr>
      <td>${idx+1}</td>
      <td>${s.regNumber || '—'}</td>
      <td>${displayName(s)}</td>
      <td>${cell(s.avgT1, m1)}</td>
      <td>${cell(s.avgT2, m2)}</td>
      <td>${cell(s.avgT3, m3)}</td>
      <td><b>${annual !== null ? annual : '—'}</b>${aNote ? `<br><span class="badge ${aNote.cls}">${aNote.label}</span>` : ''}</td>
    </tr>`;
  }).join('');
  const classAvgT1 = computeClassAverage(ranked, s => s.avgT1);
  const classAvgT2 = computeClassAverage(ranked, s => s.avgT2);
  const classAvgT3 = computeClassAverage(ranked, s => s.avgT3);
  const classAvgAnnual = computeClassAverage(ranked, s => computeAnnualAvg(s));
  const footRow = `<tfoot><tr style="background:#f7fafc;font-weight:800;">
    <td colspan="3">معدل القسم</td>
    <td>${classAvgT1 !== null ? classAvgT1 : '—'}</td>
    <td>${classAvgT2 !== null ? classAvgT2 : '—'}</td>
    <td>${classAvgT3 !== null ? classAvgT3 : '—'}</td>
    <td>${classAvgAnnual !== null ? classAvgAnnual : '—'}</td>
  </tr></tfoot>`;
  const classOpts = state.classes.map(c => `<option value="${c.id}" ${c.id===gradesState.classId?'selected':''}>${c.name}</option>`).join('');
  return `
    <div class="card">
      <h2>📊 كشف النقط حسب القسم</h2>
      <p style="font-size:13px;color:var(--text-medium);margin-bottom:8px;">
        الترتيب هنا ثابت حسب معدل <b>الفصل الأول</b> فقط، ولا يتغير عند إدخال معدلات الفصلين الثاني والثالث — بحيث يبقى كل تلميذ في نفس الموضع طوال السنة لتسهيل تتبّع تطوره.<br>
        🏷️ الإجازة (تقدير/امتياز/تهنئة/تشجيع/لوحة شرف) تُحسب لكل فصل على حدة من معدله. أما خانة السنوي فلا تأخذ هذه الإجازات، وتُكتب فيها "استدراك" فقط إذا كان المعدل السنوي بين 9 و9.99.
      </p>
      <div class="row">
        <div class="field"><label>القسم</label><select id="gradesClass" onchange="gradesState.classId=this.value; render();">${classOpts}</select></div>
        <button class="btn secondary" onclick="exportGradesPdf()">📄 PDF</button>
        <button class="btn secondary" onclick="exportGradesExcel()">📊 Excel</button>
      </div>
      <div id="gradesPrintArea">${schoolMetaLine()}<div class="table-responsive"><table><thead><tr><th>#</th><th>رقم التعريف</th><th>الاسم</th><th>ف1</th><th>ف2</th><th>ف3</th><th>السنوي</th></tr></thead><tbody>${rows || '<tr><td colspan="7" class="empty">لا يوجد تلاميذ</td></tr>'}</tbody>${ranked.length ? footRow : ''}</table></div></div>
    </div>
  `;
}
function computeClassAverage(list, avgFn) {
  const vals = list.map(avgFn).map(v => parseFloat(v)).filter(v => !isNaN(v));
  if (!vals.length) return null;
  return Math.round((vals.reduce((a,b)=>a+b,0) / vals.length) * 100) / 100;
}
function exportGradesPdf() {
  const area = document.getElementById('gradesPrintArea');
  if (!area) return toast('لا يوجد محتوى');
  toast('⏳ جاري تحضير PDF...');
  html2pdf().set({ margin: 8, filename: `كشف_نقط_${className(gradesState.classId)}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(area).save().catch(() => toast('⚠️ خطأ في PDF'));
}
function exportGradesExcel() {
  const ranked = getRankedStudents(gradesState.classId);
  const data = ranked.map((s, idx) => {
    const annual = computeAnnualAvg(s);
    const m1 = getTermMeritLabel(s.avgT1), m2 = getTermMeritLabel(s.avgT2), m3 = getTermMeritLabel(s.avgT3);
    const aNote = getAnnualNote(annual);
    return {
      'الترتيب': idx+1, 'رقم التعريف': s.regNumber || '', 'الاسم': displayName(s),
      'ف1': s.avgT1 || '', 'إجازة ف1': m1 ? m1.label : '',
      'ف2': s.avgT2 || '', 'إجازة ف2': m2 ? m2.label : '',
      'ف3': s.avgT3 || '', 'إجازة ف3': m3 ? m3.label : '',
      'السنوي': annual !== null ? annual : '', 'ملاحظة السنوي': aNote ? aNote.label : ''
    };
  });
  if (ranked.length) {
    const cAvgT1 = computeClassAverage(ranked, s => s.avgT1);
    const cAvgT2 = computeClassAverage(ranked, s => s.avgT2);
    const cAvgT3 = computeClassAverage(ranked, s => s.avgT3);
    const cAvgAnnual = computeClassAverage(ranked, s => computeAnnualAvg(s));
    data.push({
      'الترتيب': '', 'رقم التعريف': '', 'الاسم': 'معدل القسم',
      'ف1': cAvgT1 !== null ? cAvgT1 : '', 'إجازة ف1': '',
      'ف2': cAvgT2 !== null ? cAvgT2 : '', 'إجازة ف2': '',
      'ف3': cAvgT3 !== null ? cAvgT3 : '', 'إجازة ف3': '',
      'السنوي': cAvgAnnual !== null ? cAvgAnnual : '', 'ملاحظة السنوي': ''
    });
  }
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'كشف النقط');
  XLSX.writeFile(wb, `كشف_نقط_${className(gradesState.classId)}_${todayISO()}.xlsx`);
  toast('✅ تم تصدير Excel');
}

async function setCatchupHours(day, value) {
  if (!currentTtClassId) return;
  const hours = Math.max(0, Math.min(7, Number(value) || 0));
  if (!state.catchupHours[currentTtClassId]) state.catchupHours[currentTtClassId] = {};
  if (hours > 0) state.catchupHours[currentTtClassId][day] = hours;
  else delete state.catchupHours[currentTtClassId][day];
  await saveState(); render();
}
// ---------- جدول أستاذ محسوب تلقائياً (حصص + فراغ) ----------
function getTeacherScheduleGrid(teacherId) {
  const grid = {};
  state.ttDays.forEach(day => {
    grid[day] = {};
    for (let slot = 1; slot <= state.ttSlots; slot++) {
      let found = null;
      for (const cls of state.classes) {
        const data = state.timetable[`${cls.id}_${day}_${slot}`];
        if (data && data.teacherId === teacherId) {
          found = { className: cls.name, subjectName: subjectName(data.subjectId) };
          break;
        }
      }
      grid[day][slot] = found;
    }
  });
  return grid;
}
function renderTeacherSchedule() {
  if (!state.teachers.length) return `<p style="color:var(--text-medium);font-size:14px;">أضف أساتذة أولاً من تبويب "الأساتذة والمواد".</p>`;
  if (!currentScheduleTeacherId || !state.teachers.some(t => t.id === currentScheduleTeacherId)) currentScheduleTeacherId = state.teachers[0].id;
  const grid = getTeacherScheduleGrid(currentScheduleTeacherId);
  let busyCount = 0, freeCount = 0;
  let headerSlots = '';
  for (let i = 1; i <= state.ttSlots; i++) headerSlots += `<th>الحصة ${i}</th>`;
  let rows = state.ttDays.map(day => {
    let cells = `<td><b>${day}</b></td>`;
    for (let slot = 1; slot <= state.ttSlots; slot++) {
      const cell = grid[day][slot];
      if (cell) {
        busyCount++;
        cells += `<td><b>${cell.className}</b><br><span style="font-size:12px;color:var(--text-medium);">${cell.subjectName}</span></td>`;
      } else {
        freeCount++;
        cells += `<td><span class="badge success">فراغ</span></td>`;
      }
    }
    return `<tr>${cells}</tr>`;
  }).join('');
  const teacherOpts = state.teachers.map(t => `<option value="${t.id}" ${t.id===currentScheduleTeacherId?'selected':''}>${t.name}</option>`).join('');
  return `
    <div class="row">
      <div class="field"><label>الأستاذ</label><select id="scheduleTeacher" onchange="currentScheduleTeacherId=this.value; render();">${teacherOpts}</select></div>
      <button class="btn secondary" onclick="exportTeacherSchedulePdf()">🖨️ طباعة</button>
    </div>
    <p style="font-size:12px;color:var(--text-medium);margin-bottom:8px;">📊 عدد الحصص المسندة: ${busyCount} — عدد حصص الفراغ: ${freeCount}</p>
    <div id="teacherSchedulePrintArea">${schoolMetaLine()}<div class="table-responsive"><table style="text-align:center;"><thead><tr><th>اليوم</th>${headerSlots}</tr></thead><tbody>${rows}</tbody></table></div></div>
  `;
}
function exportTeacherSchedulePdf() {
  const area = document.getElementById('teacherSchedulePrintArea');
  if (!area) return toast('لا يوجد محتوى');
  const t = state.teachers.find(tc => tc.id === currentScheduleTeacherId);
  toast('⏳ جاري تحضير الطباعة...');
  html2pdf().set({ margin: 8, filename: `جدول_الأستاذ_${(t ? t.name : 'استاذ').replace(/\s+/g,'_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(area).save().catch(() => toast('⚠️ خطأ في الطباعة'));
}
function renderTeacherFreeTable() {
  if (!state.teachers.length) return `<p style="color:var(--text-medium);font-size:14px;">أضف أساتذة أولاً من تبويب "الأساتذة والمواد".</p>`;
  const dayHeaders = state.ttDays.map(d => `<th>${d}</th>`).join('');
  const rows = state.teachers.map(t => {
    const rec = state.teacherFreeSlots[t.id] || {};
    const cells = state.ttDays.map(day => {
      const val = rec[day] || '(ستملأ لاحقاً)';
      return `<td><input type="text" value="${val}" style="width:100%;min-width:110px;border:1px solid var(--secondary);border-radius:6px;padding:4px 6px;font-family:'Cairo',sans-serif;font-size:12px;" onchange="setTeacherFreeSlot('${t.id}','${day}', this.value)"></td>`;
    }).join('');
    return `<tr><td><b>${t.name}</b></td>${cells}</tr>`;
  }).join('');
  return `<div class="table-responsive"><table><thead><tr><th>الأستاذ</th>${dayHeaders}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function setTeacherFreeSlot(teacherId, day, value) {
  if (!state.teacherFreeSlots[teacherId]) state.teacherFreeSlots[teacherId] = {};
  state.teacherFreeSlots[teacherId][day] = value;
  await saveState();
}
function exportTeacherFreePdf() {
  const area = document.getElementById('teacherFreePrintArea');
  if (!area) return toast('لا يوجد محتوى');
  toast('⏳ جاري تحضير الطباعة...');
  html2pdf().set({ margin: 8, filename: `جدول_فراغ_الأساتذة.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' } }).from(area).save().catch(() => toast('⚠️ خطأ في الطباعة'));
}

async function addClass() {
  const name = document.getElementById('newClassName').value.trim();
  if (!name) return toast('اكتب اسم القسم');
  if (state.classes.some(c => c.name === name)) return toast('القسم موجود');
  state.classes.push({ id: uid('c'), name });
  await saveState(); render(); toast('✅ تمت الإضافة');
}
async function delClass(id) {
  const cls = state.classes.find(c => c.id === id);
  if (!cls) return;
  const studs = studentsOf(id);
  const msg = studs.length
    ? `سيتم نقل القسم "${cls.name}" و${studs.length} تلميذ إلى سلة المحذوفات. يمكن استرجاعهم لاحقاً. متابعة؟`
    : `نقل القسم "${cls.name}" إلى سلة المحذوفات؟`;
  if (!confirm(msg)) return;
  const batchId = uid('batch');
  addToTrash('class', cls, batchId);
  studs.forEach(s => addToTrash('student', s, batchId));
  state.classes = state.classes.filter(c => c.id !== id);
  state.students = state.students.filter(s => s.classId !== id);
  await saveState(); render();
  toast('🗑 تم النقل إلى سلة المحذوفات');
}

    avgT2: document.getElementById('s_avg2').value.trim(),

  };

}

async function transferStudents() {
  const target = prompt('أدخل ID القسم الهدف (انسخه من القائمة):');
  if (!target) return;
  if (!state.classes.some(c => c.id === target)) return toast('القسم غير موجود');
  let moved = 0;
  state.students.forEach(s => { if (classesViewState.selected.has(s.id)) { s.classId = target; moved++; } });
  classesViewState.selected.clear();
  await saveState(); render();
  toast(`✅ تم نقل ${moved} تلميذ`);
}

function editTimetable() {
  if (!currentTtClassId) return toast('اختر القسم أولاً');
  const cls = state.classes.find(c => c.id === currentTtClassId);
  let grid = '';
  state.ttDays.forEach(day => {
    for (let slot = 1; slot <= state.ttSlots; slot++) {
      const key = `${currentTtClassId}_${day}_${slot}`;
      const data = state.timetable[key] || { subjectId: '', teacherId: '' };
      const subOpts = `<option value="">—</option>` + state.subjects.map(s => `<option value="${s.id}" ${s.id===data.subjectId?'selected':''}>${s.name}</option>`).join('');
      const tchOpts = `<option value="">—</option>` + state.teachers.map(t => `<option value="${t.id}" ${t.id===data.teacherId?'selected':''}>${t.name}</option>`).join('');
      grid += `
        <div class="tt-cell">
          <h4>${day} - حصة ${slot}</h4>
          <div class="field"><label>المادة</label><select class="tt-sub" data-day="${day}" data-slot="${slot}">${subOpts}</select></div>
          <div class="field"><label>الأستاذ</label><select class="tt-tch" data-day="${day}" data-slot="${slot}">${tchOpts}</select></div>
        </div>
      `;
    }
  });
  openModal(`
    <h2>✏️ تعديل جدول ${cls.name}</h2>
    <div class="tt-grid">${grid}</div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn success" onclick="saveTimetable()">💾 حفظ</button>
      <button class="btn secondary" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
function saveTimetable() {
  const subs = document.querySelectorAll('.tt-sub');
  const tchs = document.querySelectorAll('.tt-tch');
  subs.forEach((sel, idx) => {
    const day = sel.dataset.day;
    const slot = sel.dataset.slot;
    const key = `${currentTtClassId}_${day}_${slot}`;
    const subjectId = sel.value;
    const teacherId = tchs[idx].value;
    if (subjectId || teacherId) {
      state.timetable[key] = { subjectId, teacherId };
    } else {
      delete state.timetable[key];
    }
  });
  saveState();
  closeModal();
  render();
  toast('✅ تم حفظ الجدول');
}

// ============================================================
//  ماسح QR
// ============================================================
let html5QrcodeScanner = null;
let isProcessingScan = false;
function toggleScanner(evt) {
  const container = document.getElementById('qr-reader-container');
  const btn = evt ? evt.currentTarget : document.querySelector('[onclick^="toggleScanner"]');
  if (html5QrcodeScanner) {
    stopScanner();
    container.style.display = 'none';
    if (btn) btn.textContent = '📷 تشغيل الكاميرا';
    return;
  }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('⚠️ الكاميرا تعمل فقط عبر HTTPS أو localhost');
    return;
  }
  container.style.display = 'block';
  if (btn) btn.textContent = '🛑 إيقاف';
  html5QrcodeScanner = new Html5Qrcode("qr-reader");
  html5QrcodeScanner.start(
    { facingMode: "environment" },
    { fps: 15, qrbox: 200 },
    (decodedText) => {
      if (isProcessingScan) return;
      if (decodedText.startsWith("SIJIL_ID:")) {
        isProcessingScan = true;
        const studentId = decodedText.split(":")[1];
        const student = state.students.find(s => s.id === studentId);
        if (student) {
          stopScanner();
          container.style.display = 'none';
          if (btn) btn.textContent = '📷 تشغيل الكاميرا';
          let slotsHtml = '';
          for (let i = 1; i <= state.ttSlots; i++) {
            slotsHtml += `<button class="slot-btn" onclick="registerAbsenceBySlot('${student.id}', ${i}); closeModal();">⏰ الحصة ${i} (ساعة واحدة)</button>`;
          }
          openModal(`
            <h2>📝 تسجيل غياب</h2>
            <p><b>${displayName(student)}</b> ${student.healthCondition ? `<span class="health-alert">🩺 ${student.healthCondition}</span>` : ''}</p>
            ${slotsHtml}
            <button class="btn secondary" onclick="closeModal()">إلغاء</button>
          `);
        }
        isProcessingScan = false;
      }
    },
    (err) => { console.warn('QR scan error', err); }
  ).catch((err) => {
    console.error('Camera start failed', err);
    toast('⚠️ تعذر تشغيل الكاميرا');
    html5QrcodeScanner = null;
    container.style.display = 'none';
    if (btn) btn.textContent = '📷 تشغيل الكاميرا';
  });
}
function stopScanner() {
  if (html5QrcodeScanner) {
    try { html5QrcodeScanner.stop().then(() => { html5QrcodeScanner = null; }).catch(() => { html5QrcodeScanner = null; }); } catch(e) { html5QrcodeScanner = null; }
  }
}
async function registerAbsenceBySlot(studentId, slotNumber) {
  const student = state.students.find(s => s.id === studentId);
  if (!student) return;
  if (!state.attendance[attState.date]) state.attendance[attState.date] = {};
  state.attendance[attState.date][studentId] = Number(state.attendance[attState.date][studentId] || 0) + 1;
  await saveState();
  render();
  toast(`تم تسجيل غياب الحصة ${slotNumber} لـ ${displayName(student)}`);
}

function exportData() {
  const full = buildExportPayload();
  const blob = new Blob([JSON.stringify(full, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `نسخة_${todayISO()}.json`; a.click();
  URL.revokeObjectURL(url);
  setLastExportTime(Date.now());
  hideExportBanner();
  if (activeTab === 'data') render();
  toast('✅ تم تصدير الملف — احتفظ به في مكان آمن (Drive أو بريدك الإلكتروني)');
}
function importData(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      if (imported.state) {
        state = imported.state;
        if (!state.teachers) state.teachers = [];
        if (!state.subjects) state.subjects = [];
        if (!state.timetable) state.timetable = {};
        if (imported.meta && imported.meta.supervisorName !== undefined) {
          saveSupervisorName(imported.meta.supervisorName);
        }
        await saveState(); location.reload();
      } else toast('⚠️ ملف غير صالح');
    } catch (err) { toast('⚠️ خطأ في الملف'); }
  };
  reader.readAsText(file);
}

// ============================================================
//  التهيئة والتنقل بين التبويبات
// ============================================================
function setupTabs() {
  const buttons = document.querySelectorAll('nav.tabs button');
  buttons.forEach(btn => {
    btn.onclick = function() {
      buttons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      activeTab = this.dataset.tab;
      render();
    };
  });
}
function render() {
  const main = document.getElementById('main');
  if (!main) return;
  const active = document.activeElement;
  const activeId = active && main.contains(active) ? active.id : null;
  const selStart = active ? active.selectionStart : null;
  const selEnd = active ? active.selectionEnd : null;
  let content = '';
  switch (activeTab) {
    case 'dash': content = renderDash(); break;
    case 'classes': content = renderClasses(); break;
    case 'teachers': content = renderTeachers(); break;
    case 'attendance': content = renderAttendance(); break;
    case 'notices': content = renderNotices(); break;
    case 'grades': content = renderGrades(); break;
    case 'timetable': content = renderTimetable(); break;
    case 'data': content = renderData(); break;
    default: content = '<p>تبويب غير معروف</p>';
  }
  main.innerHTML = content;
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA')) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch(e) {}
      }
    }
  }
}

window.onload = async function() {
  await loadState();

};
